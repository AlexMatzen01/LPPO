[workspace]
resolver = "2"
members = [".", "version-cli", "lppo-rt"]

[package]
name = "lppo"
version = "5.3.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.17"
toml = "0.8"
libloading = "0.8"
cc = "1.0"


[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "vm_bench"
harness = false

[build-dependencies]
serde_json = "1.0"

[patch.crates-io]
